<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#080709" />
  <title>Love Heart</title>
  <style>
    :root { color-scheme: dark; --heart-width: min(90vw, 650px); }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100svh; display: grid; place-items: center;
      overflow: hidden; background: #080709; color: #ff705d;
      font-family: "Segoe UI", "Noto Sans", "Noto Sans Devanagari", sans-serif;
    }
    main { width: 100%; min-height: 100svh; display: grid; place-items: center; padding: 18px; }
    .heart {
      position: relative; width: var(--heart-width); aspect-ratio: 1.08 / 1;
      filter: drop-shadow(0 0 16px rgb(255 76 64 / 12%));
      animation: heartIntro 1.5s cubic-bezier(.2, .8, .25, 1) both,
                 heartPulse 4.8s ease-in-out 1.5s infinite;
    }
    .word {
      position: absolute; transform: translate(-50%, -50%);
      white-space: nowrap; color: #f05b4d; font-size: clamp(10px, 1.85vw, 14px);
      font-weight: 700; line-height: 1.2; opacity: .18;
      text-shadow: 0 0 9px rgb(255 91 71 / 24%);
    }
    .fill-word {
      position: absolute; transform: translate(-50%, -50%); white-space: nowrap;
      color: #f05b4d; font-size: clamp(8px, 1.3vw, 11px); font-weight: 700;
      line-height: 1.2; opacity: 0; visibility: hidden;
    }
    .heart.center-visible .fill-word { visibility: visible; }
    @keyframes heartPulse {
      0%, 100% { opacity: .35; transform: scale(.96); filter: drop-shadow(0 0 8px rgb(255 76 64 / 12%)); }
      50% { opacity: 1; transform: scale(1.035); filter: drop-shadow(0 0 24px rgb(255 76 64 / 35%)); }
    }
    @keyframes heartIntro {
      from { transform: scale(.12) rotate(-14deg); }
      75% { transform: scale(1.06) rotate(2deg); }
      to { transform: scale(1) rotate(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .heart, .word { animation: none; opacity: 1; }
    }
  </style>
</head>
<body>
  <main aria-label="I love you in twenty languages, arranged in a heart">
    <div class="heart" id="heart" aria-hidden="true"></div>
  </main>
  <script>
    // The words trace the familiar heart outline from the reference image.
    const phrases = [
      "I love you", "Te amo", "Je t’aime", "Ich liebe dich", "Ti amo",
      "Я тебя люблю", "我爱你", "사랑해", "愛してる", "أحبك",
      "मैं तुमसे प्यार करता हूँ", "मैं तुमसे प्यार करती हूँ", "Eu te amo", "Ik hou van jou",
      "Seni seviyorum", "Anh yêu em", "Kocham cię", "Jeg elsker deg", "Σ’ αγαπώ", "ฉันรักคุณ"
    ];
    const heart = document.querySelector("#heart");
    // Parametric heart curve: its silhouette stays the same at every viewport size.
    const outline = (t) => ({
      x: 16 * Math.sin(t) ** 3,
      y: 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)
    });
    // Sample the whole curve evenly so the heart stays smooth instead of forming visible corners.
    const count = 112;
    const outlineWords = [];
    for (let i = 0; i < count; i++) {
      const p = outline(Math.PI * 2 * i / count);
      const el = document.createElement("span");
      el.className = "word";
      el.textContent = phrases[i % phrases.length];
      el.style.left = `${50 + p.x / 16 * 46}%`;
      el.style.top = `${50 - p.y / 17 * 44}%`;
      heart.append(el);
      outlineWords.push(el);
    }

    // Fill the interior in reading order, revealing each phrase after the previous one.
    let fillIndex = 0;
    const fillWords = [];
    for (let y = 0.82; y >= -0.82; y -= 0.105) {
      for (let x = -1.02; x <= 1.02; x += 0.27) {
        const equation = (x * x + y * y - 1) ** 3 - x * x * y ** 3;
        if (equation > 0) continue;
        const el = document.createElement("span");
        el.className = "fill-word";
        el.textContent = phrases[fillIndex % phrases.length];
        el.style.left = `${50 + x * 34}%`;
        el.style.top = `${50 - y * 32}%`;
        heart.append(el);
        fillWords.push(el);
        fillIndex++;
      }
    }
    // Each phrase gets its own short turn, then the sequence loops from the first phrase.
    function runWordSequence(words, step, startDelay = 0) {
      const sequenceDuration = words.length * step;
      words.forEach((el, index) => {
        const activeEnd = step / sequenceDuration;
        el.animate([
          { opacity: .18, offset: 0 },
          { opacity: 1, offset: activeEnd * .35 },
          { opacity: .18, offset: activeEnd },
          { opacity: .18, offset: 1 }
        ], {
          duration: sequenceDuration * 1000,
          delay: startDelay + index * step * 1000,
          iterations: Infinity,
          fill: "forwards",
          easing: "ease-in-out"
        });
      });
    }
    // The outline words pop into place in order for a one-time intro.
    const outlineStep = 38;
    outlineWords.forEach((el, index) => {
      el.animate([
        { opacity: 0, transform: "translate(-50%, -50%) scale(.25) rotate(-24deg)" },
        { opacity: 1, transform: "translate(-50%, -50%) scale(1.08) rotate(3deg)", offset: .78 },
        { opacity: 1, transform: "translate(-50%, -50%) scale(1) rotate(0deg)" }
      ], {
        duration: 680,
        delay: index * outlineStep,
        fill: "both",
        easing: "cubic-bezier(.2, .8, .25, 1)"
      });
    });
    const outlineIntroDuration = (outlineWords.length - 1) * outlineStep + 680;
    const centerStart = outlineIntroDuration + 400;
    setTimeout(() => heart.classList.add("center-visible"), centerStart);
    runWordSequence(fillWords, 0.14, centerStart);
  </script>
</body>
</html>
